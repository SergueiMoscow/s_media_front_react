server {
    listen 80;
    server_name stage.b-site.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stage.b-site.ru;

    ssl_certificate /etc/letsencrypt/live/stage.b-site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.b-site.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
